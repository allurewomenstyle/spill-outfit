<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allure Women Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        


        <div class="hero-banner">

            <input
                type="text"
                id="searchInput"
                placeholder="Cari nomor atau nama produk..."
            >

            <div class="profile-info">

                <img
                    src="profile.webp"
                    alt="Profile"
                    class="profile-avatar"
                >

                <div class="profile-text">

                    <h2>Allure Women Style</h2>

                    <p>
                        Spill semua outfit favorit ada di sini 🤍

                        <br>Cari berdasarkan nomor atau nama produk<br>
                        untuk menemukan item yang kamu lihat di TikTok.
                    </p>

                </div>

            </div>

        </div>

        <div id="categoryList" class="category-grid">

    <button class="category-btn active" data-category="all">
        Semua
    </button>

        </div>

        <h2
            id="sectionTitle"
            class="section-title">
            Semua Kategori Produk
        </h2>

        <div id="productList"></div>


    </div>

    <script src="script.js"></script>

</body>
</html>
